services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: mavuno_admin_pw   # SYS/SYSTEM, only for admin work
      APP_USER: mavuno                   # = DB_USER
      APP_USER_PASSWORD: mavuno          # = DB_PASSWORD
    ports: ["1521:1521"]
    volumes: [oradata:/opt/oracle/oradata]
  redis:
    image: redis:7
    ports: ["6380:6379"]
volumes:
  oradata: