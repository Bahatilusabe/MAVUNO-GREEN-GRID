services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    hostname: oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-change_me}
      APP_USER: mavuno
      APP_USER_PASSWORD: ${DB_PASSWORD:-mavuno}
    ports:
      - "1521:1521"
    volumes:
      - mavuno-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - mavuno

  ai:
    build: ./ai
    restart: unless-stopped
    env_file:
      - ./ai/.env
    environment:
      PORT: 8010
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mavuno

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      DB_USER: mavuno
      DB_PASSWORD: ${DB_PASSWORD:-mavuno}
      DB_CONNECTION_STRING: oracle:1521/FREEPDB1
      AI_BASE_URL: http://ai:8010/api/v1
      AI_SURPLUS_URL: http://ai:8010/api/v1/surplus-alerts
    ports:
      - "4000:4000"
    depends_on:
      oracle:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - mavuno

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mavuno

networks:
  mavuno:
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  mavuno-oracle-data:
    external: true