services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    hostname: oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-change_me}
      APP_USER: mavuno
      APP_USER_PASSWORD: ${DB_PASSWORD:-mavuno}
    ports:
      - "1521:1521"
    volumes:
      - mavuno-oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - mavuno

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      DB_USER: mavuno
      DB_PASSWORD: ${DB_PASSWORD:-mavuno}
      DB_CONNECTION_STRING: oracle:1521/FREEPDB1
      AI_SURPLUS_URL: ${AI_SURPLUS_URL:-http://host.docker.internal:8000/api/v1/surplus-alerts}
    ports:
      - "4000:4000"
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - mavuno

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mavuno

networks:
  mavuno:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mavuno-oracle-data:
    external: true